<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; media-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--family-board);
  color: var(--family-ink);
  font-family: var(--family-sans);
  font-size: var(--family-size-body);
  line-height: 1.6;
}
.layout { display: flex; align-items: flex-start; }
nav[aria-label="Pages"] {
  background: var(--family-nav-bg);
  border-right: 1px solid var(--family-line);
  width: 232px;
  flex: 0 0 232px;
  position: sticky;
  top: 0;
  min-height: 100vh;
  padding: 1.5rem 0;
}
nav[aria-label="Pages"] .navhead {
  font-family: var(--family-mono);
  font-size: 0.82rem;
  color: var(--family-ink-soft);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0 1.25rem 0.75rem;
}
nav[aria-label="Pages"] a {
  display: block;
  font-family: var(--family-mono);
  font-size: 0.88rem;
  color: var(--family-ink);
  text-decoration: none;
  padding: 0.45rem 1.25rem;
  border-left: 3px solid transparent;
}
nav[aria-label="Pages"] a:hover { color: var(--family-accent-ink); }
nav[aria-label="Pages"] a:focus-visible { outline: 2px solid var(--family-accent); outline-offset: -2px; }
nav[aria-label="Pages"] a[aria-current="page"] {
  border-left-color: var(--family-accent);
  color: var(--family-accent-ink);
  font-weight: 600;
  background: var(--family-ground);
}
main {
  flex: 1 1 auto;
  min-width: 0;
  margin: 1.5rem 1.75rem 2.5rem;
  padding: 2.25rem 2rem 4rem;
  border: 1px solid var(--family-line);
  border-radius: 2px;
  box-shadow: var(--family-sheet-shadow);
}
article { max-width: 46rem; }
h1 {
  font-size: var(--family-size-h1);
  line-height: 1.2;
  letter-spacing: -0.015em;
  margin: 0 0 1rem;
  text-wrap: balance;
}
h2 {
  font-size: var(--family-size-h2);
  line-height: 1.3;
  margin: 2.1rem 0 0.6rem;
  letter-spacing: -0.01em;
  text-wrap: balance;
  border-bottom: 1px solid var(--family-line);
  padding-bottom: 0.3rem;
}
h3 { font-size: var(--family-size-h3); line-height: 1.35; margin: 1.6rem 0 0.5rem; }
article p { margin: 0.7rem 0; }
article ul, article ol { margin: 0.7rem 0; padding-left: 1.4rem; }
article li { margin: 0.35rem 0; }
article a, main > footer > a, .site-links a { color: var(--family-accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
article a:focus-visible, main > footer > a:focus-visible, .site-links a:focus-visible { outline: 2px solid var(--family-accent); outline-offset: 2px; }
code {
  font-family: var(--family-mono);
  font-size: 0.86em;
  background: var(--family-code-bg);
  border: 1px solid var(--family-line);
  border-radius: 3px;
  padding: 0.08em 0.32em;
}
pre {
  overflow-x: auto;
  background: var(--family-code-bg);
  border: 1px solid var(--family-line);
  border-radius: 6px;
  margin: 0.9rem 0;
  padding: 0.85rem 1rem;
  font-family: var(--family-mono);
  line-height: 1.5;
}
pre code { background: none; border: none; padding: 0; font-size: 0.85rem; }
table {
  display: block;
  overflow-x: auto;
  border-collapse: collapse;
  font-size: 0.9rem;
  font-variant-numeric: tabular-nums;
  margin: 0.9rem 0;
}
th, td {
  border: 1px solid var(--family-line);
  padding: 0.42rem 0.65rem;
  text-align: left;
  vertical-align: top;
}
th { background: var(--family-code-bg); font-weight: 600; }
main > footer {
  max-width: 46rem;
  margin-top: 2.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--family-line);
  font-family: var(--family-mono);
  font-size: 0.8rem;
  color: var(--family-ink-soft);
}
@media (max-width: 760px) {
  .layout { display: block; }
  nav[aria-label="Pages"] {
    width: auto;
    min-height: 0;
    position: static;
    display: flex;
    overflow-x: auto;
    border-right: none;
    border-bottom: 1px solid var(--family-line);
    padding: 0;
  }
  nav[aria-label="Pages"] .navhead { display: none; }
  nav[aria-label="Pages"] a { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav[aria-label="Pages"] a[aria-current="page"] { border-bottom-color: var(--family-accent); background: none; }
  main { margin: 0.75rem 0.5rem 1.5rem; padding: 1.5rem 1rem 3rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .family-motion nav[aria-label="Pages"] a { transition: color 120ms ease; }
}
</style>
</head>
<body>
<div class="layout">
$for(include-before)$
$include-before$
$endfor$
<main class="family-sheet">
<article>
$body$
</article>
<footer>Built from <a href="$blob_base$docs-site/$srcname$">docs-site/$srcname$</a></footer>
</main>
</div>
</body>
</html>
