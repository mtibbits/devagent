# Runs the full bats and pytest test suites on every push/PR.
# bats 1.10.0-1 and python3-pytest 7.4.4 ship on ubuntu-24.04 via apt.
# Tests are hermetic: stubs replace gh/glab/curl; HOME is redirected
# per test; fixture HTTP server runs on a random port.
# claude plugin validate: non-strict rc=0 is the local rung (skips here — no
# claude CLI in CI); the CI-enforced half is tests/test_plugin_versioning.py,
# and --strict is documented-red by the #532 policy.
name: test suite

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats python3-pytest python3-yaml

      # #565: bats encodes each @test name into a shell function name in a CHILD
      # process (bats-preprocess). Without a UTF-8 locale that encoding is
      # byte-wise; on MSYS that silently skips every name carrying a non-ASCII
      # character while still counting it in the 1..N plan. The ubuntu runner
      # happens to export one today — pin it rather than inherit it.
      - name: Run bats suite
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: bats tests/

      - name: Run pytest suite
        run: python3 -m pytest tests/ -v
