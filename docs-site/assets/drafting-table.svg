<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t">
<title id="t">A drafting table with a sheet of plans pinned to it, a T-square and a lamp</title>
<style>
.wall { fill: #eef1f4; }
.floor { fill: #dfe4ea; }
.wood { fill: #b98a5a; }
.wood-dark { fill: #8a6440; }
